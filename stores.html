<script>
(function(){
  var b=document.getElementById('burger'), m=document.getElementById('mobileNav');
  if(b&&m){

    m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){m.classList.remove('open');});});

<script>
(function(){
  var data=[
    {p:"北京市",c:"北京市",d:"海淀区",name:"北京海淀店",meta:"北京市 · 海淀区",tag:"待开业",x:68,y:30},
    {p:"山东省",c:"淄博市",d:"张店区",name:"淄博张店一店",meta:"润德大厦 · 张店区",x:54,y:46},
    {p:"山东省",c:"淄博市",d:"张店区",name:"淄博张店二店",meta:"大润发 · 张店区",x:62,y:52},
    {p:"山东省",c:"威海市",d:"环翠区",name:"威海环翠店",meta:"山东省 · 威海市环翠区",x:74,y:42},
    {p:"山东省",c:"济南市",d:"历城区",name:"济南印象城店",meta:"山东省 · 济南市历城区",x:48,y:50},
    {p:"吉林省",c:"吉林市",d:"船营区",name:"吉林船营店",meta:"吉林省 · 吉林市船营区",x:78,y:24},
    {p:"湖北省",c:"武汉市",d:"全市",name:"武汉富华大厦店",meta:"湖北省 · 武汉市",x:46,y:64}
  ];
  var sel={p:"山东省",c:"淄博市",d:"张店区"};
  var provEl=document.getElementById("provList");
  var cityEl=document.getElementById("cityList");
  var distEl=document.getElementById("distList");
  var listEl=document.getElementById("storeList");
  var pinsEl=document.getElementById("pins");
  var labelEl=document.getElementById("mapLabel");
  function uniq(arr){return arr.filter(function(v,i){return arr.indexOf(v)===i;});}
  function paint(){
    var provs=uniq(data.map(function(s){return s.p;}));
    provEl.innerHTML=provs.map(function(p){
      return '<button type="button" class="lv'+(p===sel.p?' on':'')+'" data-p="'+p+'">'+p+'</button>';
    }).join("");
    var cities=uniq(data.filter(function(s){return s.p===sel.p;}).map(function(s){return s.c;}));
    if(cities.indexOf(sel.c)<0) sel.c=cities[0];
    cityEl.innerHTML=cities.map(function(c){
      return '<button type="button" class="lv'+(c===sel.c?' on':'')+'" data-c="'+c+'">'+c+'</button>';
    }).join("");
    var dists=uniq(data.filter(function(s){return s.p===sel.p&&s.c===sel.c;}).map(function(s){return s.d;}));
    if(dists.indexOf(sel.d)<0) sel.d=dists[0];
    distEl.innerHTML=dists.map(function(d){
      return '<button type="button" class="pill'+(d===sel.d?' on':'')+'" data-d="'+d+'">'+d+'</button>';
    }).join("");
    var shown=data.filter(function(s){return s.p===sel.p&&s.c===sel.c&&s.d===sel.d;});
    listEl.innerHTML=shown.map(function(s){
      return '<article class="store-tile"><b>'+s.name+'</b><span>'+s.meta+'</span>'+(s.tag?'<span class="tag">'+s.tag+'</span>':'')+'</article>';
    }).join("");
    pinsEl.innerHTML=shown.map(function(s){
      return '<i class="pin" style="left:'+s.x+'%;top:'+s.y+'%"></i>';
    }).join("");
    labelEl.innerHTML='<b>'+sel.c+' · '+sel.d+'</b><span>GetX 门店地图示意</span>';
  }
  document.getElementById("finder").addEventListener("click",function(e){
    var t=e.target.closest("button");
    if(!t) return;
    if(t.dataset.p){sel.p=t.dataset.p; sel.c=""; sel.d="";}
    if(t.dataset.c){sel.c=t.dataset.c; sel.d="";}
    if(t.dataset.d){sel.d=t.dataset.d;}
    paint();
  });
  paint();
})();
</script>
